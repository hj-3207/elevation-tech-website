<!DOCTYPE html>
<!-- Source for img/drawodds-og.jpg, the 1200x630 link-preview image (og:image).
     Render with headless Edge from the site root:
       msedge --headless=new --window-size=1200,630 --screenshot=img/drawodds-og.png tools/draw-odds/og-card.html
     then save as JPEG. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0a0a0a;color:#fff;font-family:Inter,sans-serif}
body{position:relative;
  background-image:linear-gradient(rgba(204,85,0,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(204,85,0,0.06) 1px,transparent 1px);
  background-size:48px 48px}
.left{position:absolute;left:64px;top:70px;width:520px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:0.16em;text-transform:uppercase;color:#CC5500}
.eyebrow span{color:#555}
h1{font-size:84px;font-weight:900;letter-spacing:-0.04em;line-height:0.98;margin:22px 0 24px}
h1 b{color:#CC5500;font-weight:900;display:block}
.rule{width:56px;height:3px;background:#CC5500;margin-bottom:26px}
p{font-size:24px;line-height:1.45;color:#b8b8b8}
p b{color:#fff;font-weight:700}
.foot{position:absolute;left:64px;bottom:52px;display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',monospace;font-size:18px;color:#8a8a8a;letter-spacing:0.04em}
.foot img{width:64px;height:auto}
.shot{position:absolute;right:-40px;top:64px;width:600px;height:502px;border-radius:14px;overflow:hidden;border:1px solid rgba(204,85,0,0.45);
  box-shadow:0 30px 70px rgba(0,0,0,0.7),0 0 0 6px rgba(204,85,0,0.06)}
.shot img{position:absolute;left:-14px;top:-160px;width:1200px}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 70%,rgba(10,10,10,0.85))}
</style></head><body>
<div class="left">
  <div class="eyebrow"><span>// </span>Big game draws</div>
  <h1>Utah<b>Draw Odds</b></h1>
  <div class="rule"></div>
  <p>Guaranteed points, split groups, <b>your random-draw odds</b> and next year's projections for every Utah big game hunt.</p>
</div>
<div class="foot"><img src="../../img/drawodds-icon.png" alt="">elevationtechsolutions.net</div>
<div class="shot"><img src="../../img/drawodds-screenshot.jpg" alt=""></div>
</body></html>
