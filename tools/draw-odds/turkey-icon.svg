<!-- Source of img/drawodds-turkey.png: a white turkey track (three long front toes and a
     short back toe), drawn for the Draw Odds species button to sit beside Rack Scorer's
     white bear paw. Render with headless Edge on a transparent background
     (the default-background-color=00000000 switch), crop to the drawing, resize to 64 px tall. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="480" height="520">
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- front toes, spreading from the heel pad -->
    <path d="M60 78 C 59 60, 59 38, 60 10" stroke-width="13"/>
    <path d="M58 80 C 46 66, 32 52, 14 38" stroke-width="12"/>
    <path d="M62 80 C 74 66, 88 52, 106 38" stroke-width="12"/>
    <!-- back toe -->
    <path d="M60 86 L 60 116" stroke-width="11"/>
  </g>
  <!-- heel pad -->
  <ellipse cx="60" cy="82" rx="13" ry="11" fill="#fff"/>
</svg>
