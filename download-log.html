<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Unlinked, and reached from the admin page. Same situation as license-admin.html: the
     repository is public, so treat this file as readable by anyone. It holds only the
     project URL and the publishable key, both of which already ship inside the desktop
     apps. Signed out, the API returns nothing. -->
<meta name="robots" content="noindex, nofollow">
<title>Download Log | Elevation Technology</title>
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
<link rel="stylesheet" href="style.css">
<script src="admin-auth.js"></script>
<style>
  .la-wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .la-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .la-head h1 { font-size: 1.5rem; color: #fff; }
  .la-back { font-family: var(--mono); font-size: 0.74rem; color: var(--muted); text-decoration: none; }
  .la-back:hover { color: var(--orange-bright); }
  .la-msg { display: none; margin-bottom: 1.25rem; padding: 0.85rem 1.1rem; border-radius: 8px;
    font-family: var(--mono); font-size: 0.8rem; border: 1px solid var(--border); background: var(--card); color: #ddd; }
  .la-msg.show { display: block; }
  .la-msg.bad { border-color: #7a2b2b; color: #ffb4b4; }

  .vtab-row { justify-content: flex-start; margin-top: 0; margin-bottom: 1.75rem; }
  .la-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 2rem; }
  .la-stat { background: var(--card); padding: 1.05rem 1.2rem; }
  .la-stat b { display: block; font-size: 1.45rem; color: #fff; font-weight: 800; }
  .la-stat span { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); }

  .dl-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 2rem; align-items: start; }
  @media (max-width: 880px) { .dl-grid { grid-template-columns: 1fr; } }
  .dl-sub { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 0.8rem; }

  table.la-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .la-tablewrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .la-table th { text-align: left; padding: 0.7rem 0.9rem; background: #101010; color: var(--muted);
    font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.07em; text-transform: uppercase;
    border-bottom: 1px solid var(--border); }
  .la-table td { padding: 0.55rem 0.9rem; border-bottom: 1px solid #171717; color: #ccc; }
  .la-table tr:last-child td { border-bottom: none; }
  .la-mono { font-family: var(--mono); }
  /* Day bars: a count alone does not say whether it was steady or one burst. */
  .dl-bar { position: relative; height: 100%; }
  .dl-bar i { position: absolute; inset: 0 auto 0 0; background: rgba(204,85,0,0.30); display: block; }
  .dl-bar em { position: relative; font-style: normal; font-family: var(--mono); font-size: 0.76rem; color: #ddd; padding-left: 0.4rem; }
  .la-mini { background: none; border: 1px solid var(--border); color: #999; border-radius: 6px;
    padding: 0.35rem 0.7rem; font-family: var(--mono); font-size: 0.68rem; cursor: pointer; }
  .la-mini:hover { color: #fff; border-color: var(--orange); }
  .la-count { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); margin: 0.8rem 0; }
</style>
</head>
<body>

<div class="la-wrap">
  <div class="la-head">
    <h1>Download Log</h1>
    <a class="la-back" href="license-admin.html">&larr; back to licence admin</a>
  </div>

  <div class="la-msg" id="msg"></div>
  <div class="vtab-row" id="tabs"></div>
  <div class="la-stats" id="stats"></div>

  <div class="dl-grid">
    <div>
      <div class="dl-sub">By day</div>
      <div class="la-tablewrap">
        <table class="la-table">
          <thead><tr><th>Day</th><th>Clicks</th></tr></thead>
          <tbody id="days"></tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="dl-sub">Every click</div>
      <div class="la-tablewrap">
        <table class="la-table">
          <thead><tr><th>#</th><th>When</th><th>Ago</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="la-count" id="count"></div>
      <button class="la-mini" id="more" hidden>Load older</button>
    </div>
  </div>
</div>

<script>
/* Download click log.
 *
 * Shares the session that license-admin.html put in localStorage, so signing in once
 * covers both pages. Auth itself lives in admin-auth.js, shared by both.
 *
 * Times display in the browser's own timezone. The stored values are timestamptz, so the
 * conversion is real rather than cosmetic.
 */
(function () {
  var PAGE = 200;

  var TABLES = [
    ['downloads', 'Rack Detector'],
    ['downloads_rackviewer', 'Rack Viewer'],
    ['downloads_racktracker', 'Rack Tracker'],
    ['downloads_rackscorer', 'Rack Scorer']
  ];

  var el = function (id) { return document.getElementById(id); };
  var table = (location.search.match(/[?&]t=([a-z_]+)/) || [])[1] || 'downloads';
  if (!TABLES.some(function (t) { return t[0] === table; })) table = 'downloads';
  var loaded = [];
  var grandTotal = null;

  // Auth lives in admin-auth.js, shared with the other admin pages. Aliased locally so
  // the rest of this file reads the same as before.
  var session = LA.session, saveSession = LA.saveSession, clearSession = LA.clearSession,
      refresh = LA.refresh, authFetch = LA.authFetch;

  function say(text, bad) {
    var m = el('msg');
    m.textContent = text || '';
    m.className = 'la-msg' + (text ? ' show' : '') + (bad ? ' bad' : '');
  }

  function label() {
    var t = TABLES.filter(function (x) { return x[0] === table; })[0];
    return t ? t[1] : table;
  }

  function tabs() {
    el('tabs').innerHTML = TABLES.map(function (t) {
      return '<a class="vtab' + (t[0] === table ? ' is-on' : '') +
             '" style="text-decoration:none;" href="?t=' + t[0] + '">' + t[1] + '</a>';
    }).join('');
  }

  function ago(d) {
    var s = (Date.now() - d) / 1000;
    if (s < 90) return Math.round(s) + 's';
    if (s < 5400) return Math.round(s / 60) + 'm';
    if (s < 172800) return Math.round(s / 3600) + 'h';
    return Math.round(s / 86400) + 'd';
  }

  function stats() {
    var now = Date.now();
    var d1 = loaded.filter(function (r) { return now - r <= 864e5; }).length;
    var d7 = loaded.filter(function (r) { return now - r <= 7 * 864e5; }).length;
    var d30 = loaded.filter(function (r) { return now - r <= 30 * 864e5; }).length;
    // 24h/7d/30d are exact whenever the loaded window already reaches past 30 days.
    var reaches30 = grandTotal != null && (loaded.length >= grandTotal ||
                    (loaded.length && now - loaded[loaded.length - 1] > 30 * 864e5));
    el('stats').innerHTML =
      '<div class="la-stat"><b>' + (grandTotal == null ? '--' : grandTotal) + '</b><span>' + label() + ' all time</span></div>' +
      '<div class="la-stat"><b>' + d30 + (reaches30 ? '' : '+') + '</b><span>last 30 days</span></div>' +
      '<div class="la-stat"><b>' + d7 + '</b><span>last 7 days</span></div>' +
      '<div class="la-stat"><b>' + d1 + '</b><span>last 24 hours</span></div>';
  }

  function byDay() {
    var map = {};
    loaded.forEach(function (t) {
      var d = new Date(t);
      var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
              '-' + String(d.getDate()).padStart(2, '0');
      map[k] = (map[k] || 0) + 1;
    });
    var keys = Object.keys(map).sort().reverse().slice(0, 30);
    var peak = Math.max.apply(null, keys.map(function (k) { return map[k]; }).concat([1]));
    el('days').innerHTML = keys.length ? keys.map(function (k) {
      var pct = Math.round(map[k] / peak * 100);
      return '<tr><td class="la-mono">' + k + '</td>' +
             '<td><span class="dl-bar"><i style="width:' + pct + '%"></i>' +
             '<em>' + map[k] + '</em></span></td></tr>';
    }).join('') : '<tr><td colspan="2" class="la-mono" style="color:#666;">No clicks recorded yet.</td></tr>';
  }

  function list() {
    el('rows').innerHTML = loaded.length ? loaded.map(function (t, i) {
      return '<tr><td class="la-mono" style="color:#666;">' + (i + 1) + '</td>' +
             '<td class="la-mono">' + new Date(t).toLocaleString() + '</td>' +
             '<td class="la-mono" style="color:#666;">' + ago(t) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="la-mono" style="color:#666;">Nothing yet. Click a download or store button on the site, then reload.</td></tr>';
    el('count').textContent = 'showing ' + loaded.length +
      (grandTotal != null ? ' of ' + grandTotal : '') + ' clicks, newest first';
    el('more').hidden = !(grandTotal != null && loaded.length < grandTotal);
  }

  function page(offset) {
    return authFetch('/rest/v1/' + table + '?select=created_at&order=created_at.desc&limit=' +
                     PAGE + '&offset=' + offset,
                     { headers: { Prefer: 'count=exact' } })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          throw new Error('Not authorised. Sign in on the licence admin page first.');
        }
        if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 140)); });
        var cr = r.headers.get('content-range') || '';
        var n = cr.split('/')[1];
        if (n && n !== '*') grandTotal = parseInt(n, 10);
        return r.json();
      })
      .then(function (batch) {
        batch.forEach(function (x) { loaded.push(+new Date(x.created_at)); });
        stats(); byDay(); list();
      });
  }

  el('more').addEventListener('click', function () {
    say('Loading...');
    page(loaded.length).then(function () { say(''); })
      .catch(function (e) { say(e.message, true); });
  });

  tabs();
  say('Loading...');
  page(0).then(function () { say(''); }).catch(function (e) { say(e.message, true); });
})();
</script>

</body>
</html>
